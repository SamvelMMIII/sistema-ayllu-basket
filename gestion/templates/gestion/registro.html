{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Crear cuenta | Ayllu Basket
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'gestion/recursos/css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'gestion/recursos/css/acceso.css' %}">
  </head>
  <body class="auth-page" data-home-url="{% url 'gestion:home' %}">
    <main class="auth-card">
      <section class="auth-brand">
        <a class="brand" href="{% url 'gestion:acceso' %}"><img src="{% static 'gestion/recursos/img/ayllu-basket-logo.jpg' %}" alt=""><span>AYLLU <b>BASKET</b></span></a>
        <div class="auth-brand-copy">
          <span class="auth-mark"><i class="bi bi-people"></i></span>
          <h1>
            Crear cuenta
          </h1>
          <p>
            Club de Básquetbol Ayllu Basket
          </p>
        </div>
        <div class="auth-brand-mark">
          <small>Club de Básquetbol Ayllu Basket</small>
        </div>
      </section>
      <section class="auth-panel">
        <h2>
          Crear cuenta
        </h2>
        <p>
          Completa tus datos para registrarte.
        </p>
        <form class="auth-form" data-auth-form="register">
          <div class="form-field">
            <label for="register-name">Nombre completo</label><input class="field" id="register-name" name="name" autocomplete="name" placeholder="Nombre y apellido" required>
          </div>
          <div class="form-field">
            <label for="register-email">Correo electrónico</label><input class="field" id="register-email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.cl" required>
          </div>
          <div class="form-field">
            <label for="register-phone">Teléfono</label><input class="field" id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="+56 9 1234 5678" required>
          </div>
          <div class="form-field">
            <label for="register-password">Contraseña</label><input class="field" id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" required>
          </div>
          <div class="form-field">
            <label for="register-confirm">Confirmar contraseña</label><input class="field" id="register-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña" required>
          </div>
          <p class="auth-error" data-auth-error aria-live="polite">
          </p>
          <button class="btn btn-primary" type="submit">Crear cuenta <i class="bi bi-arrow-right"></i></button>
        </form>
        <p class="auth-switch">
          ¿Ya tienes una cuenta? <a href="{% url 'gestion:acceso' %}">Iniciar sesión</a>
        </p>
      </section>
    </main>
    <script src="{% static 'gestion/recursos/js/app.js' %}"></script>
  </body>
</html>
